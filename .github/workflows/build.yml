name: Build & Release

on:
    push:
        # A push to main releases automatically when manifest.json carries a
        # version that has no tag yet; pushing a v* tag by hand still works.
        branches: [main]
        tags: ["v*"]

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.check.outputs.tag }}
            release: ${{ steps.check.outputs.release }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Decide whether to release
              id: check
              run: |
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                      echo "release=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  version=$(grep -m1 '"version"' manifest.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
                  tag="v${version}"
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                      echo "${tag} already exists; nothing to release."
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "New version ${tag}; releasing."
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: version
        if: needs.version.outputs.release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build extensions
              run: |
                  chmod +x build.sh
                  ./build.sh all

            - name: Upload Firefox artifact
              uses: actions/upload-artifact@v4
              with:
                  name: staminai-firefox
                  path: dist/staminai-firefox.xpi

            - name: Upload Chromium artifact
              uses: actions/upload-artifact@v4
              with:
                  name: staminai-chromium
                  path: dist/staminai-chromium.zip

    release:
        needs: [version, build]
        if: needs.version.outputs.release == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  # Creates the tag on this commit when it doesn't exist yet.
                  # (A tag pushed with GITHUB_TOKEN wouldn't trigger a new run,
                  # which is why the release happens here in the same run.)
                  tag_name: ${{ needs.version.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  generate_release_notes: true
                  files: |
                      artifacts/staminai-firefox/staminai-firefox.xpi
                      artifacts/staminai-chromium/staminai-chromium.zip
